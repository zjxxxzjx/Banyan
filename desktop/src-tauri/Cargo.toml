[package]
name = "banyan"
version = "0.1.3"
description = "Banyan Git client desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
