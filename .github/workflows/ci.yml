name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - name: Syntax check all JS
        run: |
          set -e
          for f in server.js lib/*.js public/js/*.js public/js/views/*.js test/*.js; do
            node --check "$f"
          done
      - name: Smoke tests (git lib + REST API)
        run: npm test